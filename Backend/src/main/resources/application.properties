# Nombre de la aplicación
spring.application.name=techandes-backend

# Configuración de conexión a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/techandes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=argeol1234

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# "update" crea o actualiza las tablas automáticamente en MySQL según tus clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect